name: Convert tokenizer.model to FlatBuffers (tokenizer.spm.fb)

on:
  workflow_dispatch:

jobs:
  convert-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libprotobuf-dev protobuf-compiler libabsl-dev flatbuffers-compiler libflatbuffers-dev ninja-build

      - name: Verify Local tokenizer.model
        run: |
          if [ ! -f "tokenizer.model" ]; then
            echo "❌ Error: tokenizer.model not found in root directory!"
            exit 1
          fi
          ls -lh tokenizer.model

      - name: Build spm_to_fb Converter Tool
        run: |
          mkdir -p build_converter
          cd build_converter
          cmake ../lite \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPM_ENABLE_BENCHMARK=OFF \
            -DBUILD_TESTING=OFF
          ninja spm_to_fb
          ls -lh spm_to_fb

      - name: Convert Model to FlatBuffers
        run: |
          ./build_converter/spm_to_fb \
            --model=tokenizer.model \
            --output=tokenizer.spm.fb
          ls -lh tokenizer.spm.fb

      - name: Upload Converted Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatbuffer-tokenizer
          path: tokenizer.spm.fb
