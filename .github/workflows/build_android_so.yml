name: Build Android NDK Shared Libraries (.so)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android21
          - abi: armeabi-v7a
            target: armv7a-linux-androideabi21
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Generate FlatBuffers Header on Host
        run: |
          git clone --depth 1 https://github.com/google/flatbuffers.git host_flatbuffers
          cmake -B host_flatc_build -S host_flatbuffers -DFLATBUFFERS_BUILD_TESTS=OFF
          cmake --build host_flatc_build --target flatc -j$(nproc)
          
          # تولید هدر با فلگ رسمی مشخص‌شده در مخزن
          ./host_flatc_build/flatc -c --gen-object-api -o lite/ lite/sentencepiece_lite.fbs
          ls -l lite/sentencepiece_lite_generated.h

      - name: Compile .so directly using Android Clang
        run: |
          TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          CXX=$TOOLCHAIN/${{ matrix.target }}-clang++
          
          mkdir -p output/${{ matrix.abi }}
          
          # کامپایل مستقل با ادغام کامل رانتایم C++ (بدون نیاز به libc++_shared.so)
          $CXX -std=c++20 -O3 -fPIC -shared \
            -static-libstdc++ \
            -I. -Ilite -Ihost_flatbuffers/include \
            lite/sentencepiece_lite.cc \
            lite/jni_wrapper.cc \
            -llog \
            -o output/${{ matrix.abi }}/libsentencepiece_lite.so
            
          ls -lh output/${{ matrix.abi }}/libsentencepiece_lite.so

      - name: Upload ABI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentencepiece-lite-${{ matrix.abi }}
          path: output/
